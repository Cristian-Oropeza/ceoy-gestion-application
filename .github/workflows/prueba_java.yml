name: Pruebas Java

on:
  push:
    branches:
      - main

jobs:
  testear-codigo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Pruebas
        run: mvn test
